    position: relative;
  }
  /* Tablero estilo piel de Creeper */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      conic-gradient(from 90deg at 1px 1px, transparent 25%, rgba(57,255,60,.10) 0) 0 0 / 56px 56px,
      repeating-conic-gradient(rgba(57,255,60,.07) 0 25%, rgba(0,0,0,0) 0 50%) 0 0 / 56px 56px;
    -webkit-mask-image: radial-gradient(circle at 50% 38%, #000 0%, transparent 72%);
            mask-image: radial-gradient(circle at 50% 38%, #000 0%, transparent 72%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed; left: 50%; top: 30%;
    width: 520px; height: 520px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(57,255,60,.22), transparent 65%);
    filter: blur(20px);
    pointer-events: none;
  }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    text-align: center;
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .logo {
    width: 168px; height: 168px;
    margin: 0 auto 8px;
    display: block;
    border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle closest-side, #000 86%, transparent 100%);
            mask-image: radial-gradient(circle closest-side, #000 86%, transparent 100%);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-7px); } }

  .tag {
    display: inline-block;
    font: 700 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--g1);
    padding: 7px 12px;
    border: 1px solid var(--line);
    background: rgba(57,255,60,.07);
    margin-bottom: 14px;
  }
  h1 {
    font-size: 34px; line-height: 1.05; font-weight: 900; letter-spacing: .02em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 18px rgba(57,255,60,.55), 0 3px 0 var(--g3);
  }
  h1 em { font-style: normal; color: var(--g1); }
  .sub {
    margin-top: 12px;
    color: var(--muted); font-size: 15px; line-height: 1.5;
  }
  .sub b { color: var(--text); font-weight: 700; }


  /* Barra de carga en bloques */
  .bar {
    margin: 28px 0 18px;
    height: 14px; padding: 2px;
    background: #031207;
    border: 2px solid var(--g3);
    box-shadow: 0 0 16px rgba(57,255,60,.18);
  }
  .bar span {
    display: block; height: 100%; width: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,.35) 8px 10px),
      linear-gradient(180deg, var(--g1), var(--g2));
    box-shadow: 0 0 12px rgba(57,255,60,.7);
    animation: fill 3s steps(24, end) forwards;
  }
  @keyframes fill { to { width: 100%; } }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 15px 18px;
    font-size: 15px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
    color: #021006; text-decoration: none;
    background: linear-gradient(180deg, var(--g1), var(--g2));
    border-bottom: 4px solid var(--g3);
    box-shadow: 0 0 26px rgba(57,255,60,.35);
    transition: transform .12s ease;
  }
  .btn:active { transform: translateY(3px); border-bottom-width: 1px; }
  .btn svg { width: 18px; height: 18px; }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); }

  .legal {
    margin-top: 26px;
    font-size: 11px; line-height: 1.5; color: rgba(141,187,146,.6);
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .wrap { animation: none; }
    .bar span { animation-duration: .01s; }
  }
</style>
</head>
